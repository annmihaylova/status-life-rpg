<h2>Вход в Status</h2>
<p>Код для входа:</p>
<p style="font-size:28px;font-family:monospace;letter-spacing:4px"><strong>{{ .Token }}</strong></p>
<p>Введи его на странице входа. Или просто нажми на ссылку:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">Войти в Status</a></p>
<p style="color:#888">Если ты не запрашивала вход, просто проигнорируй это письмо.</p>
